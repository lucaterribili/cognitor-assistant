# Corpus di conversazioni (seed, scritto da un LLM, da rivedere).
# Formato di un turno, una riga:   {u: testo dell'utente, move: mossa, topic: argomento, ent: [tipi di entità
# nominati], carry: [tipi di entità presi dai turni precedenti], rag: ok|low|none, bot: azione giusta}
# `topic`, `ent`, `carry` e `rag` sono opzionali (rag: ok se omesso). Le azioni sono quelle di dialogue/actions.py.
# `source`: hand | llm. `reviewed`: mettere true dopo averla letta e approvata.
conversations:
  - id: base-01
    source: llm
    reviewed: false
    turns:
      - {u: "Buongiorno", move: greeting, bot: greet}
      - {u: "A che ora apre il pronto soccorso?", move: question, topic: opening_hours, ent: [DEPARTMENT], bot: answer}
      - {u: "Grazie mille", move: thanks, bot: thanks_reply}
      - {u: "No, nient'altro", move: deny, bot: goodbye}

