      - {u: "Voglio prenotare una visita oculistica online", move: question, topic: booking, ent: [MEDICAL_PROCEDURE], bot: answer}
      - {u: "Grazie", move: thanks, bot: thanks_reply}

  - id: slot-09
    source: llm
    reviewed: false
    turns:
      - {u: "A che ora chiude?", move: question, topic: opening_hours, bot: ask_slot}
      - {u: "Qual è il numero del CUP?", move: question, topic: phone, ent: [FACILITY], bot: answer}
      - {u: "Grazie", move: thanks, bot: thanks_reply}

  - id: slot-10
    source: llm
    reviewed: false
    turns:
      - {u: "Come ci arrivo?", move: question, topic: directions, bot: ask_slot}
      - {u: "All'ospedale Santa Maria", move: slot_reply, ent: [FACILITY], bot: answer}
      - {u: "C'è un autobus?", move: question, topic: directions, carry: [FACILITY], bot: answer}
      - {u: "Perfetto, grazie", move: thanks, bot: thanks_reply}
      - {u: "Ciao", move: goodbye, bot: goodbye}
