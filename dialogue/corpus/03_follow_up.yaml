# Follow-up: l'argomento o l'entità non sono nel messaggio e vengono dal contesto.
conversations:
  - id: follow-01
    source: llm
    reviewed: false
    turns:
      - {u: "A che ora apre la radiologia?", move: question, topic: opening_hours, ent: [DEPARTMENT], bot: answer}
      - {u: "E la cardiologia?", move: follow_up_entity, ent: [DEPARTMENT], bot: answer}
      - {u: "E il laboratorio analisi?", move: follow_up_entity, ent: [DEPARTMENT], bot: answer}
      - {u: "Grazie", move: thanks, bot: thanks_reply}

  - id: follow-02
