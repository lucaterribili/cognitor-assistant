# Conversazioni scritte per colmare le lacune del corpus (transizioni mai viste, azioni rare, argomenti e tipi di
# entità poco usati). Seguono le convenzioni delle conversazioni riviste: incomprensibile -> clarify (poi fallback),
# fuori argomento -> fallback, "non è quello" dopo una risposta -> clarify, conferma dopo un chiarimento a retrieval
# basso -> prompt, "sì" a una domanda su uno slot -> ask_slot di nuovo.
# Tutte source: llm, reviewed: false: da leggere e correggere.
conversations:
  # ---- durante la richiesta di uno slot ----
  - id: gap-slot-01
    source: llm
    reviewed: false
    turns:
      - {u: "Come prenoto una visita?", move: question, topic: booking, bot: ask_slot}
      - {u: "Preferisco parlare con una persona", move: handoff, bot: handoff}

  - id: gap-slot-02
    source: llm
    reviewed: false
    turns:
      - {u: "Qual è il numero di telefono?", move: question, topic: phone, bot: ask_slot}
      - {u: "Lascia stare, arrivederci", move: goodbye, bot: goodbye}

  - id: gap-slot-03
    source: llm
    reviewed: false
    turns:
      - {u: "A che ora chiude?", move: question, topic: opening_hours, bot: ask_slot}
      - {u: "Chi ha vinto il campionato?", move: out_of_scope, bot: fallback}
      - {u: "Il distretto sanitario di Valle Verde", move: slot_reply, ent: [ORGANIZATION], bot: answer}
      - {u: "Grazie", move: thanks, bot: thanks_reply}

  - id: gap-slot-04
