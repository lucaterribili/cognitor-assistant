      - {u: "La visita dal dermatologo", move: slot_reply, ent: [MEDICAL_PROCEDURE], bot: answer}
      - {u: "Ok", move: confirm, bot: offer_more}
      - {u: "No, grazie", move: deny, bot: goodbye}

  - id: gap-slot-06
