# Flussi di conversazione per l'apprendimento della lingua russa
# Gestisce due macro-flussi:
#   1. translation_flow  – l'utente chiede traduzioni puntuali
#   2. guided_learning_flow – percorso guidato passo-passo

conversations:

  # ── Flusso 1: Traduzione ────────────────────────────────────────────────────
  russian_translation_word_flow:
    description: "L'utente chiede come si dice una parola in russo"
    steps:
      - user: russian_translate_word
        bot: russian_translate_word_response

  russian_translation_phrase_flow:
    description: "L'utente chiede come si traduce una frase in russo"
    steps:
      - user: russian_translate_phrase
        bot: russian_translate_phrase_response

  russian_translation_extended_flow:
    description: >
      Flusso completo di traduzione: l'utente chiede una o più traduzioni
      e poi può richiedere una frase o passare al percorso guidato
    steps:
      - user: russian_translate_word
        bot: russian_translate_word_response
        goal: translate_word
      - user: russian_translate_phrase
        bot: russian_translate_phrase_response
        goal: translate_phrase
      - user: russian_learn_start
        bot: russian_learn_start_response
        goal: start_learning

  # ── Flusso 2: Percorso guidato completo ────────────────────────────────────
  russian_guided_learning_flow:
    description: >
      Percorso guidato di apprendimento del russo dall'inizio alla fine:
      avvio → alfabeto → saluti → numeri → frasi utili → grammatica
    steps:
      - user: russian_learn_start
        bot: russian_learn_start_response
        goal: start_russian_learning
      - user: russian_next_lesson
        bot: russian_learn_alphabet_response
        goal: learn_alphabet
      - user: russian_next_lesson
        bot: russian_learn_greetings_response
        goal: learn_greetings
      - user: russian_next_lesson
        bot: russian_learn_numbers_response
        goal: learn_numbers
      - user: russian_next_lesson
        bot: russian_learn_phrases_response
        goal: learn_phrases
      - user: russian_next_lesson
        bot: russian_learn_grammar_response
        goal: learn_grammar

  # ── Flusso 3: Argomento specifico diretto ──────────────────────────────────
  russian_alphabet_flow:
    description: "L'utente vuole imparare solo l'alfabeto cirillico"
    steps:
      - user: russian_learn_alphabet
        bot: russian_learn_alphabet_response
        goal: learn_alphabet
      - user: russian_next_lesson
        bot: russian_learn_greetings_response
        goal: learn_greetings

  russian_greetings_flow:
    description: "L'utente vuole imparare i saluti in russo"
    steps:
      - user: russian_learn_greetings
        bot: russian_learn_greetings_response
        goal: learn_greetings
      - user: russian_next_lesson
        bot: russian_learn_numbers_response
        goal: learn_numbers

  russian_numbers_flow:
    description: "L'utente vuole imparare i numeri in russo"
    steps:
      - user: russian_learn_numbers
        bot: russian_learn_numbers_response
        goal: learn_numbers
      - user: russian_next_lesson
        bot: russian_learn_phrases_response
        goal: learn_phrases

  russian_phrases_flow:
    description: "L'utente vuole imparare frasi utili in russo"
    steps:
      - user: russian_learn_phrases
        bot: russian_learn_phrases_response
        goal: learn_phrases
      - user: russian_next_lesson
        bot: russian_learn_grammar_response
        goal: learn_grammar

  russian_grammar_flow:
    description: "L'utente vuole imparare la grammatica russa di base"
    steps:
      - user: russian_learn_grammar
        bot: russian_learn_grammar_response
        goal: learn_grammar

  # ── Flusso 4: Ripasso ───────────────────────────────────────────────────────
  russian_repeat_flow:
    description: "L'utente vuole ripetere o ripassare una lezione"
    steps:
      - user: russian_repeat_lesson
        bot: russian_repeat_lesson_response
        goal: repeat_lesson
      - user: russian_learn_alphabet
        bot: russian_learn_alphabet_response
        goal: learn_alphabet

  # ── Flusso 5: Misto – traduzione + percorso guidato ─────────────────────────
  russian_mixed_flow:
    description: >
      L'utente alterna domande di traduzione e lezioni del percorso guidato.
      Mostra come i due flussi coesistono nella stessa conversazione.
    steps:
      - user: russian_translate_word
        bot: russian_translate_word_response
        goal: translate_word
      - user: russian_learn_start
        bot: russian_learn_start_response
        goal: start_learning
      - user: russian_next_lesson
        bot: russian_learn_alphabet_response
        goal: learn_alphabet
      - user: russian_translate_phrase
        bot: russian_translate_phrase_response
        goal: translate_phrase
      - user: russian_next_lesson
        bot: russian_learn_greetings_response
        goal: learn_greetings
      - user: russian_repeat_lesson
        bot: russian_repeat_lesson_response
        goal: repeat_lesson
