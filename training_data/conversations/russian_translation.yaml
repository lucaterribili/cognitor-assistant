conversations:
  russian_translation_word_flow:
    description: "L'utente chiede come si dice una parola in russo"
    steps:
      - user: russian_translate_word
        bot: __russian_translate

  russian_translation_phrase_flow:
    description: "L'utente chiede come si traduce una frase in russo"
    steps:
      - user: russian_translate_phrase
        bot: __russian_translate

  russian_translation_extended_flow:
    description: >
      Flusso completo di traduzione: l'utente chiede una o più traduzioni
      e poi può richiedere una frase o passare al percorso guidato
    steps:
      - user: russian_translate_word
        bot: __russian_translate
        goal: translate_word
      - user: russian_translate_phrase
        bot: __russian_translate
        goal: translate_phrase
      - user: russian_learn_start
        bot: russian_learn_start_response
        goal: start_learning
