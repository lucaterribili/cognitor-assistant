      bot: ask_name_tten_response
  ask_name_tten_after_prodotti_flow: &id009
    description: ask_name dopo una domanda sui prodotti
    steps:
    - user: ask_tten_prodotti
      bot: tten_prodotti_overview_response
    - user: ask_name
      bot: ask_name_tten_response
  ask_name_tten_after_team_flow: &id010
    description: ask_name dopo una domanda sul team
    steps:
    - user: ask_tten_team
      bot: tten_team_response
