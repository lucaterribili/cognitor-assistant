# Story del dominio tten che insegnano alla Dialogue Policy a rispondere a
# ask_name con l'identita brandizzata TTen (ask_name_tten_response) invece
# della risposta generica di knowledge/responses/base.yaml (ask_name_response).
# Ogni story e triplicata (_v2/_v3, stesso contenuto) per aumentare il peso di
# questo segnale nel training rispetto alle poche story generiche equivalenti
# in knowledge/, che sulla stessa combinazione (contesto, ask_name) puntano alla
# risposta generica: senza un peso schiacciante il modello, con un dataset cosi
# piccolo, tendeva a preferire comunque la risposta generica.

conversations:
  ask_name_tten_standalone_flow: &id001
    description: ask_name come primo turno sul dominio tten
    steps:
    - user: ask_name
      bot: ask_name_tten_response
  ask_name_tten_after_greeting_flow: &id002
    description: ask_name dopo un saluto
    steps:
    - user: greeting
      bot: greeting_response
    - user: ask_name
      bot: ask_name_tten_response
  ask_name_tten_after_azienda_flow: &id003
    description: ask_name dopo una domanda sull'azienda
    steps:
    - user: ask_tten_azienda
      bot: tten_azienda_response
    - user: ask_name
      bot: ask_name_tten_response
  ask_name_tten_after_servizi_flow: &id004
    description: ask_name dopo una domanda sui servizi
    steps:
    - user: ask_tten_servizi
      bot: tten_servizi_response
    - user: ask_name
      bot: ask_name_tten_response
  ask_name_tten_after_settore_flow: &id005
