      bot: __calculate
    - user: ask_name
      bot: ask_name_tten_response
  ask_name_tten_before_farewell_flow: &id016
    description: ask_name seguito da un congedo
    steps:
    - user: ask_name
      bot: ask_name_tten_response
    - user: farewell
      bot: farewell_response
