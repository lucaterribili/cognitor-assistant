    - a cosa serve [spring boot](PROG_CONCEPT)
    - spiegami [spring boot](PROG_CONCEPT)
    # Risposte "nude" a una sola parola: succede quando il bot ha già chiesto
    # "chiedimi di uno di questi termini" (wait di ask_programming_concept) e
    # l'utente risponde con il solo nome del termine, senza wrapper ("cos'è",
    # "spiegami"...) attorno.
    - "[linguaggio di programmazione](PROG_CONCEPT)"
    - "[framework](PROG_CONCEPT)"
    - "[cms](PROG_CONCEPT)"
    - "[backend](PROG_CONCEPT)"
    - "[frontend](PROG_CONCEPT)"
