responses:
  russian_vocabulary_days_response:
    - |
      **Giorni della Settimana (Дни недели)** 🗓️

      *   Понедельник (Ponedel'nik) - Lunedì
      *   Вторник (Vtornik) - Martedì
      *   Среда (Sreda) - Mercoledì
      *   Четверг (Chetverg) - Giovedì
      *   Пятница (Pyatnitsa) - Venerdì
      *   Суббота (Subbota) - Sabato
      *   Воскресенье (Voskresen'ye) - Domenica

      *Ricorda:* I giorni della settimana in russo iniziano con la lettera minuscola.

  russian_vocabulary_months_response:
    - |
      **Mesi dell'Anno (Месяцы)** 📅

      *   Январь (Yanvar') - Gennaio
      *   Февраль (Fevral') - Febbraio
      *   Март (Mart) - Marzo
      *   Апрель (Aprel') - Aprile
      *   Май (May) - Maggio
      *   Июнь (Iyun') - Giugno
      *   Июль (Iyul') - Luglio
      *   Август (Avgust) - Agosto
      *   Сентябрь (Sentyabr') - Settembre
      *   Октябрь (Oktyabr') - Ottobre
      *   Ноябрь (Noyabr') - Novembre
      *   Декабрь (Dekabr') - Dicembre

  russian_vocabulary_colors_response:
