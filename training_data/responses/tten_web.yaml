responses:
  tten_web_response:
    - >-
      Siamo il partner ideale per la realizzazione di siti web completi e
      tecnologicamente avanzati: la nostra web agency realizza siti
      personalizzati e di grande impatto visivo. Offriamo tre servizi:
      sviluppo siti web, social media marketing e SEO/posizionamento.

      Il costo dipende dalle esigenze del progetto: scrivici per un
      preventivo su misura.
    - >-
      I nostri siti web funzionano perché ci poniamo degli obiettivi e li
      raggiungiamo: design pulito e trendy, comunicazione eccellente, codice
      100% responsive, strutture interattive, opzioni illimitate,
      prevenzione e manutenzione, integrazione con i social network.

      Il costo dipende dalle esigenze del progetto: scrivici per un
      preventivo su misura.
    - >-
      Un sito è efficace quando è accattivante e responsive, ha i contenuti
      giusti, è ben posizionato sui motori di ricerca ed è supportato da
      social media marketing. Per questo lavoriamo sul brand, sui contenuti,
      sugli obiettivi, sul marketing, sul piano editoriale e sui social
      network.

      Il costo dipende dalle esigenze del progetto: scrivici per un
      preventivo su misura.
