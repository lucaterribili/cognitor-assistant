responses:
  russian_learn_numbers_response:
    - |
      I **numeri in russo** da 1 a 10 🔢

      1 → один (odin)
      2 → два (dva)
      3 → три (tri)
      4 → четыре (chetyre)
      5 → пять (pyat')
      6 → шесть (shest')
      7 → семь (sem')
      8 → восемь (vosem')
      9 → девять (devyat')
      10 → десять (desyat')

      Prova a ripeterli ad alta voce! Scrivi 'prossima lezione' per le frasi utili.
