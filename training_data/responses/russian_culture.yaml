responses:
  russian_culture_intro_response:
    - |
      🇷🇺 La Russia è il paese più esteso del mondo, a cavallo tra Europa e Asia, con Mosca come capitale e San Pietroburgo come storica "finestra sull'Europa" di Pietro il Grande. Ha dato i natali a Puškin, Tolstoj, Dostoevskij e Čajkovskij, e la sua lingua si scrive con l'alfabeto cirillico.

      Vuoi conoscerla anche attraverso la lingua? Scrivi 'voglio imparare il russo' per iniziare il percorso guidato, o 'prossima lezione' se hai già cominciato!
