responses:
  tten_capabilities_response:
    - |-
      Posso aiutarti su diverse cose:

      - **Azienda**: chi è TTen, competenze e tecnologie
      - **Servizi e soluzioni**: cosa offriamo (system integration, formazione, PMO...)
      - **Settori**: bancario, assicurativo, pubblico, privato
      - **Prodotti**: KEasy, PEasy, Mercurius Mail, GeCo
      - **Datacenter, hosting e siti web**
      - **Cyber security**
      - **Team e contatti**

      Posso anche fare piccoli calcoli, cercare informazioni sul web e spiegarti qualche nozione base di programmazione. Chiedimi pure quello che ti interessa!
