responses:
  tten_cyber_security_response:
    - >-
      Offriamo una gamma di servizi di consulenza per creare programmi di
      sicurezza su misura e gestire le vulnerabilità di aziende e Pubblica
      Amministrazione: il rischio cyber può portare al blocco dei processi,
      alla sottrazione o violazione di dati e a danni economici e
      reputazionali.
    - >-
      I nostri servizi principali sono quattro: Security Posture (verifica
      obblighi normativi e stato delle funzioni aziendali), Information
      Security Governance (governo della sicurezza, analisi del rischio,
      politiche e procedure, anche con un Security Manager on-demand),
      Cloud Migration (analisi dei servizi da migrare, scelta del provider,
      piano di entrata e uscita dal cloud, valutazioni normative come GDPR
      e DORA) e la Predisposizione alla Certificazione ISO 27001:2022, con
      consulenti certificati che affiancano l'azienda in tutto il percorso.
    - >-
      Offriamo anche DevSecOps: un servizio che integra la sicurezza fin
      dalle prime fasi dello sviluppo software, con definizione degli
      obiettivi di sicurezza, formazione del team, integrazione della
      sicurezza nel ciclo di vita del software e monitoraggio continuo.
      L'automazione dei test di sicurezza (SAST, DAST, MAST, Penetration
      Test) è fondamentale per identificare e risolvere i problemi più
      rapidamente. I servizi di Security Posture, Information Security
      Governance e Cloud Migration sono forniti con il supporto degli
      esperti di S.I.E.T.E.L. S.p.A.
