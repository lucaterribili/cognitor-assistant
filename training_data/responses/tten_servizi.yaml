responses:
  tten_servizi_response:
    - >-
      I nostri servizi principali sono quattro: Formazione (corsi IT per il
      personale), System Integration (progetti "chiavi in mano" e migrazioni
      software/OS), System and Application Management (manutenzione,
      dimensionamento delle infrastrutture, monitoraggio della rete) e
      Software Factory (analisi e progettazione di applicazioni
      personalizzate e sistemi complessi).
    - >-
      Offriamo consulenza su main-frame, sistemi dipartimentali, architetture
      client-server (internet e intranet) e sistemi locali, oltre allo
      sviluppo di prodotti su misura. La nostra struttura punta a garantire
      il massimo livello di qualità riducendo al contempo i costi.
    - >-
      Offriamo anche un servizio di PMO (Project Management Office) che
      opera in affiancamento al responsabile di progetto, su tre aree:
      supporto metodologico, supporto operativo e gestione delle risorse.
    - >-
      Ci avvaliamo di risorse professionalmente qualificate: capi progetto,
      progettisti di soluzioni internet e client-server, database
      administrator, analisti, sviluppatori e sistemisti - il valore aggiunto
      del nostro servizio di outsourcing.
