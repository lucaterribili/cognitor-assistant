responses:
  russian_learn_grammar_response:
    - |
      **Grammatica russa di base** 📚

      Il russo ha 3 generi (maschile, femminile, neutro) e i verbi si coniugano in base a persona e numero.
      Esempio con "говорить" (parlare):
      Я говорю (io parlo) | Ты говоришь (tu parli) | Он/она говорит (lui/lei parla)

      Inoltre esiste la distinzione tra registro formale e informale e tra aspetto verbale perfettivo/imperfettivo.
      Scrivi 'prossima lezione' per passare ai casi grammaticali.
