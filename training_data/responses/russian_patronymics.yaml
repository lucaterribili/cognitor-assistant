  russian_patronymics_response:
    - |
      **Il Patronimico (Отчество - Otchestvo)** 👨‍👦

      In Russia, il nome completo è composto da: Nome + Patronimico + Cognome.
      Il patronimico deriva dal nome del padre con l'aggiunta di suffissi:

      *   **Per gli uomini:** si aggiunge spesso **-ovich** (ович) o **-evich** (евич).
          *Esempio:* Ivan -> Ivanovich.
      *   **Per le donne:** si aggiunge spesso **-ovna** (овна) o **-evna** (евна).
          *Esempio:* Ivan -> Ivanovna.

      Si usa insieme al nome proprio (es. *Ivan Ivanovich*) in contesti formali o per mostrare rispetto.
