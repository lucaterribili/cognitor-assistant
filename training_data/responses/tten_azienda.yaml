responses:
  tten_azienda_response:
    - >-
      TTen è una società di consulenza informatica: progettiamo software per
      realizzare soluzioni sempre all'avanguardia. Siamo impegnati
      nell'erogazione di servizi informatici e nella formazione del
      personale, e il know-how che abbiamo maturato negli anni ci permette di
      accompagnare i clienti nella crescita del loro business.
    - >-
      Siamo TTen, una società di consulenza informatica. I nostri centri di
      competenza capitalizzano l'esperienza maturata in ambiti specifici -
      infrastrutture e sistemi, sviluppo Java e Microsoft, help desk, mobile,
      project management, sviluppo host - per supportare i clienti nello
      sviluppo di soluzioni all'avanguardia.
    - >-
      TTen lavora su tecnologie molto diverse tra loro: database come Oracle,
      SQL Server, MySQL e IBM DB2, sistemi operativi Windows/Linux/macOS/
      iOS/Android e ambienti mainframe IBM, linguaggi come Java, PHP, C#,
      Cobol e JavaScript, piattaforme come Oracle WebLogic, IBM WebSphere,
      JBoss, .NET e cloud OpenStack.
    - >-
      Lavoriamo anche insieme a diversi partner tecnologici, tra cui
      TopNetwork, Pegaso2000, ProgettoPA, AGS Group, TAS Group, Intersistemi,
      Softlab, Aritmos e 3Net.
