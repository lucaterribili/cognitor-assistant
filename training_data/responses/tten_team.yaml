responses:
  tten_team_response:
    - >-
      Un elemento fondamentale della nostra filosofia aziendale è la
      creazione di un gruppo forte e coeso: il nostro staff non vive la
      società come un corpo estraneo, ma come un legame che nasce dalla
      relazione tra le persone.
    - >-
      Il nostro team comprende, tra gli altri, Ivano Visco (IT analyst),
      Riccardo D'Argenio (responsabile amministrativo), Maurizio Benvenuti
      (garante qualità e GDPR), Andrea Giacopello (sviluppatore .NET),
      Anselmo Di Giacomo (sviluppatore Java), Stefano Pimpolari (sviluppatore
      PHP), Erminio Delle Donne (graphic e web designer) e Francesca De
      Castro (analista programmatore).
    - >-
      Investiamo sulla crescita professionale: l'acquisizione di nuove
      competenze, la capitalizzazione dell'esperienza e la costante ricerca
      dell'innovazione sono l'impegno quotidiano di un'azienda come la
      nostra.
