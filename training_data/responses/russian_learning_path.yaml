responses:
  russian_learn_start_response:
    - "Benvenuto nel percorso guidato di russo! 🇷🇺 Inizieremo dall'alfabeto cirillico, poi passeremo ai saluti, ai numeri, alle frasi utili, ai pronomi e patronimici, alla grammatica generale e ai casi. Scrivi 'prossima lezione' per avanzare o fammi una domanda di traduzione in qualsiasi momento!"
    - "Ottima scelta! Il russo è una lingua affascinante. Il percorso guidato si svolge così: 1️⃣ Alfabeto cirillico → 2️⃣ Saluti → 3️⃣ Numeri → 4️⃣ Frasi utili → 5️⃣ Pronomi e Patronimici → 6️⃣ Grammatica generale → 7️⃣ Casi russi. Cominciamo? Scrivi 'prossima lezione' per partire!"

  russian_learn_alphabet_response:
    - |
      L'alfabeto russo si chiama **cirillico** e conta 33 lettere. Eccone alcune fondamentali:

      А а → suono "a"   |  Б б → suono "b"   |  В в → suono "v"
      Г г → suono "g"   |  Д д → suono "d"   |  Е е → suono "ye"
      З з → suono "z"   |  И и → suono "i"   |  К к → suono "k"
      Л л → suono "l"   |  М м → suono "m"   |  Н н → suono "n"
      О о → suono "o"   |  П п → suono "p"   |  Р р → suono "r" (moscia)
      С с → suono "s"   |  Т т → suono "t"   |  У у → suono "u"
      Х х → suono "h"   |  Ц ц → suono "ts"  |  Ш ш → suono "sc"
      Я я → suono "ya"

      Scrivi 'prossima lezione' per passare ai saluti! 😊

  russian_learn_phrases_response:
    - |
      **Frasi utili in russo** per viaggiare e comunicare 🗣️

      • Пожалуйста (Pozhaluysta) → Per favore / Prego
      • Спасибо (Spasibo) → Grazie
      • Извините (Izvinite) → Scusi / Mi scusi
      • Да (Da) → Sì
      • Нет (Net) → No
      • Я ne ponimayu (Ya ne ponimayu) → Non capisco
      • Govorite medlennee (Govorite medlennee) → Parli più lentamente
      • Gde nakhoditsya…? (Gde nakhoditsya…?) → Dove si trova…?
      • Skol'ko stoit? (Skol'ko stoit?) → Quanto costa?
      • Pomogite! (Pomogite!) → Aiuto!
      • Mne nuzhen vrach (Mne nuzhen vrach) → Ho bisogno di un medico
      • Ya ne govoryu po-russki (Ya ne govoryu po-russki) → Non parlo russo

      Scrivi 'prossima lezione' per i pronomi e i patronimici!

  russian_next_lesson_response:
    - "Ottimo! Procediamo con la lezione successiva. Dimmi da dove vuoi continuare: 1️⃣ Alfabeto | 2️⃣ Saluti | 3️⃣ Numeri | 4️⃣ Frasi utili | 5️⃣ Pronomi e Patronimici | 6️⃣ Grammatica (Generi, Plurale, Verbi) | 7️⃣ Casi Russi | 8️⃣ Verbi di Moto e Aspetti | 9️⃣ Vocabolario (Giorni, Mesi, Colori). Scrivi il numero o l'argomento!"

  russian_repeat_lesson_response:
    - "Nessun problema! La ripetizione è la chiave dell'apprendimento. 🔄 Di' quale argomento vuoi ripassare: Alfabeto, Saluti, Numeri, Frasi utili, Pronomi, Patronimici, Grammatica, Casi, Verbi di Moto o Vocabolario."

  russian_learn_difficulty_faq_response:
    - "Il russo può sembrare impegnativo all'inizio, soprattutto per l'alfabeto cirillico e i casi grammaticali, ma con un po' di pratica quotidiana diventa molto più naturale! 💪 Ti conviene procedere un passo alla volta: scrivi 'voglio imparare il russo' per iniziare il percorso guidato, oppure 'prossima lezione' se hai già cominciato."
    - "Non più difficile di altre lingue, solo diverso dall'italiano: l'alfabeto cirillico si impara in pochi giorni, mentre i casi grammaticali richiedono più pratica. Il percorso guidato ti accompagna passo passo — scrivi 'prossima lezione' per continuare da dove sei arrivato!"
