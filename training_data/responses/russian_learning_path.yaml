responses:
  russian_learn_start_response:
    - "Benvenuto nel percorso guidato di russo! 🇷🇺 Inizieremo dall'alfabeto cirillico, poi passeremo ai saluti, ai numeri, alle frasi utili, alla grammatica generale e ai casi. Scrivi 'prossima lezione' per avanzare o fammi una domanda di traduzione in qualsiasi momento!"
    - "Ottima scelta! Il russo è una lingua affascinante. Il percorso guidato si svolge così: 1️⃣ Alfabeto cirillico → 2️⃣ Saluti → 3️⃣ Numeri → 4️⃣ Frasi utili → 5️⃣ Grammatica generale → 6️⃣ Casi russi. Cominciamo? Scrivi 'prossima lezione' per partire!"

  russian_learn_alphabet_response:
    - |
      L'alfabeto russo si chiama **cirillico** e conta 33 lettere. Eccone alcune fondamentali:

      А а → suono "a"   |  Б б → suono "b"   |  В в → suono "v"
      Г г → suono "g"   |  Д д → suono "d"   |  Е е → suono "ye"
      З з → suono "z"   |  И и → suono "i"   |  К к → suono "k"
      Л л → suono "l"   |  М м → suono "m"   |  Н н → suono "n"
      О о → suono "o"   |  П п → suono "p"   |  Р р → suono "r" (moscia)
      С с → suono "s"   |  Т т → suono "t"   |  У у → suono "u"
      Х х → suono "h"   |  Ц ц → suono "ts"  |  Ш ш → suono "sc"
      Я я → suono "ya"

      Scrivi 'prossima lezione' per passare ai saluti! 😊

  russian_learn_phrases_response:
    - |
      **Frasi utili in russo** per viaggiare e comunicare 🗣️

      • Пожалуйста (Pozhaluysta) → Per favore / Prego
      • Спасибо (Spasibo) → Grazie
      • Извините (Izvinite) → Scusi / Mi scusi
      • Да (Da) → Sì
      • Нет (Net) → No
      • Я не понимаю (Ya ne ponimayu) → Non capisco
      • Говорите медленнее (Govorite medlennee) → Parli più lentamente
      • Где находится…? (Gde nakhoditsya…?) → Dove si trova…?
      • Сколько стоит? (Skol'ko stoit?) → Quanto costa?
      • Помогите! (Pomogite!) → Aiuto!
      • Мне нужен врач (Mne nuzhen vrach) → Ho bisogno di un medico
      • Я не говорю по-русски (Ya ne govoryu po-russki) → Non parlo russo

      Scrivi 'prossima lezione' per la grammatica generale!

  russian_next_lesson_response:
    - "Ottimo! Procediamo con la lezione successiva. Dimmi da dove vuoi continuare: 1️⃣ Alfabeto cirillico | 2️⃣ Saluti | 3️⃣ Numeri | 4️⃣ Frasi utili | 5️⃣ Grammatica generale | 6️⃣ Casi russi. Scrivi il numero o il nome dell'argomento!"

  russian_repeat_lesson_response:
    - "Nessun problema! La ripetizione è la chiave dell'apprendimento. 🔄 Di' quale argomento vuoi ripassare: Alfabeto, Saluti, Numeri, Frasi utili, Grammatica generale o Casi russi."
