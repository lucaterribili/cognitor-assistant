responses:
  tten_hosting_response:
    - >-
      Gli hosting non sono tutti uguali: garantiamo una larghezza di banda
      molto ampia così da poter lavorare senza tempi morti o rallentamenti.
      Non appesantiamo i nostri server, riservando a tutti i clienti lo
      spazio, la linea e la banda adeguati.

      Il costo dipende dal piano e dalle esigenze: scrivici per un
      preventivo su misura.
    - >-
      Offriamo tre servizi: registrazione del dominio, soluzioni di hosting
      (spazio, banda ampia, traffico garantito, firewall) e posta
      elettronica con indirizzi professionali sul tuo dominio.

      Il costo dipende dal piano e dalle esigenze: scrivici per un
      preventivo su misura.
    - >-
      I nostri spazi hosting, grazie a sistemi firewall efficaci, offrono
      una protezione e una sicurezza d'uso molto alta, con assistenza
      tecnica dedicata.

      Il costo dipende dal piano e dalle esigenze: scrivici per un
      preventivo su misura.
