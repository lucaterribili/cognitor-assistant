      3. Dativo (destinatario): Книге (al libro)
      4. Accusativo (oggetto diretto): Книгу (il libro come oggetto)
      5. Strumentale (mezzo/compagnia): Книгой (con il libro)
      6. Prepositivo (luogo/argomento): О книге (del libro)

