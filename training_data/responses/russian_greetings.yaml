responses:
  russian_learn_greetings_response:
    - |
      Ecco i **saluti di base in russo** 🤝

      • Привет! (Privet!) → Ciao! (informale)
      • Здравствуйте! (Zdravstvuyte!) → Buongiorno / Salve (formale)
      • Доброе утро! (Dobroye utro!) → Buongiorno (mattina)
      • Добрый вечер! (Dobryy vecher!) → Buonasera
      • До свидания! (Do svidaniya!) → Arrivederci
      • Пока! (Poka!) → Ciao! / A presto! (informale)
      • Как дела? (Kak dela?) → Come stai?
      • Меня зовут… (Menya zovut…) → Mi chiamo…
      • Приятно познакомиться! (Priyatno poznakomit'sya!) → Piacere di conoscerti!

      Prova a usarli! Scrivi 'prossima lezione' per i numeri.
