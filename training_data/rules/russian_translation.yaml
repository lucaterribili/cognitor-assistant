rules:
  russian_translate_word:
    slots:
      TRANSLATION_TEXT:
        required: true
        entity: TRANSLATION_TEXT
        type: string
    wait: russian_translate_missing_text_response
    default: __russian_translate

  russian_translate_phrase:
    slots:
      TRANSLATION_TEXT:
        required: true
        entity: TRANSLATION_TEXT
        type: string
    wait: russian_translate_missing_text_response
    default: __russian_translate
