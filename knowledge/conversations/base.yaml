# Conversations base del chatbot Cognitor
# Definisce i flussi di conversazione attesi

conversations:
  simple_flow:
    description: "Flusso di conversazione minimale"
    steps:
      - user: greeting
        bot: greeting_response
      - user: ask_name
        bot: ask_name_response
      - user: farewell
        bot: farewell_response

  help_flow:
    description: "Flusso per richiesta aiuto"
    steps:
      - user: greeting
        bot: greeting_response
      - user: ask_help
        bot: help_options_response
        goal: get_help
      - user: select_help_option
        bot: detailed_help_response
      - user: follow_up_question
        bot: follow_up_response
      - user: farewell
        bot: farewell_response

  information_flow:
    description: "Flusso per richiesta informazioni"
    steps:
      - user: greeting
        bot: greeting_response
      - user: ask_information
        bot: information_response
        goal: get_information
      - user: more_details
        bot: detailed_information_response
      - user: confirmation
        bot: confirmation_response
      - user: farewell
        bot: farewell_response

  quick_greeting_flow:
    description: "Flusso minimale di saluto e congedo (2 step)"
    steps:
      - user: greeting
        bot: greeting_response
      - user: farewell
        bot: farewell_response

  weather_check_flow:
    description: "Flusso per controllo meteo (3 step)"
    steps:
      - user: greeting
        bot: greeting_response
      - user: weather_query
        bot: weather_query_response
        goal: get_weather
      - user: farewell
        bot: farewell_response

  restaurant_booking_flow:
    description: "Flusso per prenotazione ristorante (5 step)"
    steps:
      - user: greeting
        bot: greeting_response
      - user: restaurant_booking
        bot: restaurant_booking_response
        goal: book_restaurant
      - user: date_query
        bot: date_query_response
      - user: thank_you
        bot: thank_you_response
      - user: farewell
        bot: farewell_response

  news_flow:
    description: "Flusso per lettura notizie con approfondimento (4 step)"
    steps:
      - user: greeting
        bot: greeting_response
      - user: read_news
        bot: read_news_response
        goal: read_news
      - user: more_info
        bot: more_info_response
      - user: farewell
        bot: farewell_response

  mood_support_flow:
    description: "Flusso di supporto per umore negativo (3 step)"
    steps:
      - user: greeting
        bot: greeting_response
      - user: mood_unhappy
        bot: mood_unhappy_response
        goal: get_support
      - user: farewell
        bot: farewell_response

  taxi_booking_flow:
    description: "Flusso per prenotazione taxi (4 step)"
    steps:
      - user: greeting
        bot: greeting_response
      - user: taxi_ride
        bot: taxi_ride_response
        goal: book_taxi
      - user: thank_you
        bot: thank_you_response
      - user: farewell
        bot: farewell_response

  flight_booking_flow:
    description: "Flusso per prenotazione volo (6 step)"
    steps:
      - user: greeting
        bot: greeting_response
      - user: book_flight
        bot: book_flight_response
        goal: book_flight
      - user: date_query
        bot: date_query_response
      - user: time_query
        bot: time_query_response
      - user: thank_you
        bot: thank_you_response
      - user: farewell
        bot: farewell_response

  culture_search_flow:
    description: "Flusso di ricerca culturale con estrazione entità e retrieval"
    steps:
      - user: greeting
        bot: greeting_response
      - user: ask_culture
        bot: ask_culture_response
        goal: culture_search
      - user: thank_you
        bot: thank_you_response
      - user: farewell
        bot: farewell_response

  definition_search_flow:
    description: "Flusso di ricerca definizioni tecniche"
    steps:
      - user: greeting
        bot: greeting_response
      - user: ask_definition
        bot: ask_culture_response
        goal: definition_search
      - user: thank_you
        bot: thank_you_response
      - user: farewell
        bot: farewell_response

  meeting_flow:
    description: "Flusso completo per organizzazione riunione (7 step)"
    steps:
      - user: greeting
        bot: greeting_response
      - user: schedule_meeting
        bot: schedule_meeting_response
        goal: schedule_meeting
      - user: date_query
        bot: date_query_response
      - user: time_query
        bot: time_query_response
      - user: ask_name
        bot: ask_name_response
      - user: thank_you
        bot: thank_you_response
      - user: farewell
        bot: farewell_response
  web_search_flow:
    description: "Flusso per ricerca web tramite DuckDuckGo"
    steps:
      - user: greeting
        bot: greeting_response
      - user: web_search
        bot: __web_search
        goal: web_search
      - user: farewell
        bot: farewell_response

  # ========================================
  # ask_name in contesti vari: con solo 2 occorrenze (sempre subito dopo
  # greeting, o incastonato in meeting_flow) la Dialogue Policy ML aveva
  # segnale troppo debole e confondeva ask_name con greeting/farewell,
  # che dominano le stories (30 e 14 occorrenze). Queste story aggiuntive
  # variano il contesto che precede ask_name per generalizzare meglio.
  # ========================================

  ask_name_standalone_flow:
    description: "ask_name come primo turno, senza contesto precedente"
    steps:
      - user: ask_name
        bot: ask_name_response

  ask_name_after_calculate_flow:
    description: "ask_name subito dopo un calcolo"
    steps:
      - user: calculate
        bot: __calculate
      - user: ask_name
        bot: ask_name_response

  ask_name_after_thank_you_flow:
    description: "ask_name dopo un ringraziamento"
    steps:
      - user: greeting
        bot: greeting_response
      - user: thank_you
        bot: thank_you_response
      - user: ask_name
        bot: ask_name_response

  ask_name_after_joke_flow:
    description: "ask_name dopo una barzelletta"
    steps:
      - user: joke
        bot: joke_response
      - user: ask_name
        bot: ask_name_response

  ask_name_before_farewell_flow:
    description: "ask_name seguito da un congedo"
    steps:
      - user: ask_name
        bot: ask_name_response
      - user: farewell
        bot: farewell_response

  ask_name_after_weather_flow:
    description: "ask_name dopo una richiesta meteo"
    steps:
      - user: weather_query
        bot: weather_query_response
      - user: ask_name
        bot: ask_name_response
