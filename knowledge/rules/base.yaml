# Rules per gli intent del chatbot Arianna
# Formato DSL dichiarativo - Runtime interpreterà queste regole

rules:
  # ========================================
  # Intent semplici (solo default response)
  # ========================================

  compliment:
    default: compliment_response

  insult:
    default: insult_response

  bot_challenge:
    default: bot_challenge_response

  mood_great:
    default: mood_great_response

  # Se l'utente ha già accettato di "parlarne" (CHATBOT_PROPOSAL=talk_given,
  # impostato da mood_support_talk_response) e poi esprime un'ulteriore
  # difficoltà, ripetere la stessa offerta "vuoi parlarne?" lo intrappola in un
  # loop e lascia intendere che il bot possa fare da supporto psicologico reale
  # - qui invece riconosciamo un ambito che il bot non copre e lo reindirizziamo,
  # senza ripetere l'offerta da capo.
  mood_unhappy:
    slots:
      CHATBOT_PROPOSAL:
        required: false
        type: string
        entity: CHATBOT_PROPOSAL
    cases:
      talk_given: mood_support_redirect_response
    default: mood_unhappy_response

  joke:
    default: joke_response

  # "sì"/"ok" nudo (intent confirm) va interpretato in base a cosa il bot ha
  # appena proposto (CHATBOT_PROPOSAL, slot inline impostato dalla risposta
  # precedente - vedi knowledge/responses/base.yaml), non come conferma
  # generica: altrimenti un "sì" a "vuoi una barzelletta?" veniva
  # reinterpretato da zero come una frase qualsiasi.
  confirm:
    slots:
      CHATBOT_PROPOSAL:
        required: false
        type: string
        entity: CHATBOT_PROPOSAL
    cases:
      joke: joke_response
      talk: mood_support_talk_response
    default: confirm_response

  weather_query:
    default: weather_query_response

  time_query:
    default: __time_query_response

  date_query:
    default: date_query_response

  low_confidence_fallback:
    default: low_confidence_fallback_response

  out_of_scope:
    default: out_of_scope_response

  ask_health_status:
    default: ask_health_status_response

  change_topic:
    default: change_topic_response

  # ========================================
  # Intent con slot: ask_city_touristic_information
  # ========================================

  ask_city_touristic_information:
    slots:
      LOCATION:
        required: true
        type: string
        entity: LOCATION
      CATEGORY:
        required: true
        type: string
        entity: CATEGORY

    cases:
      Roma|musei: ask_city_touristic_information_roma_musei_response
      Roma|ristoranti: ask_city_touristic_information_roma_ristoranti_response
      Roma|attrazioni: ask_city_touristic_information_roma_attrazioni_response
      Milano|musei: ask_city_touristic_information_milano_musei_response
      Milano|ristoranti: ask_city_touristic_information_milano_ristoranti_response
      Milano|attrazioni: ask_city_touristic_information_milano_attrazioni_response

    wait:
      LOCATION: ask_location_wait_response
      CATEGORY: ask_category_wait_response

    fallback: ask_location_unsupported_response

  # ========================================
  # Intent con slot: ask_touristic_place_information
  # ========================================

  ask_touristic_place_information:
    slots:
      query:
        required: true
        type: string
        entity: LOCATION
    default: __web_search
    wait: ask_touristic_place_information_wait_response

  # ========================================
  # Intent con slot: open_app
  # ========================================

  open_app:
    slots:
      PRODUCT:
        required: true
        type: string
        entity: PRODUCT

    cases:
      WhatsApp: open_app_whatsapp_response
      Telegram: open_app_telegram_response
      Spotify: open_app_spotify_response
      Chrome: open_app_chrome_response

    fallback: open_app_unsupported_response
    wait: open_app_wait_response

  # ========================================
  # Intent con slot opzionale: introduce_user
  # ========================================

  introduce_user:
    slots:
      PERSON:
        required: true
        type: string
        entity: PERSON

    default: introduce_user_response
    wait: introduce_user_wait_response

  # ========================================
  # Esempio: Bot imposta slot via set_slots (confirm)
  # ========================================

  confirm_roma:
    default: confirmed_roma_response
    set_slots:
      LOCATION: "Roma"
      CONFIRMATION: true

  # ========================================
  # Esempio: Bot imposta slot via risposta inline
  # ========================================

  inline_slot_example:
    default: inline_slot_example_response

  # ========================================
  # Operations (prefisso __)
  # ========================================

  calculate:
    default: __calculate

  location_query:
    default: __location_query

  web_search:
    slots:
      query:
        required: true
        type: string
        entity: QUERY

    default: __web_search
    wait: web_search_wait_response

  # ========================================
  # Intent con slot: translate
  # ========================================

  translate:
    slots:
      TRANSLATION_TEXT:
        required: true
        type: string
        entity: TRANSLATION_TEXT
      LANGUAGE:
        required: false
        type: string
        entity: LANGUAGE

    default: __cognitor_translate
    wait: translate_wait_response

  # ========================================
  # Funzionalità non ancora implementate
  # ========================================

  volume_up:
    default: not_implemented_response

  volume_down:
    default: not_implemented_response

  call:
    default: not_implemented_response

  football:
    default: not_implemented_response

  team_cheer:
    slots:
      TEAM:
        required: false
        type: string
        entity: TEAM
    default: team_cheer_response

  set_reminder:
    default: not_implemented_response

  send_message:
    default: not_implemented_response

  make_note:
    default: not_implemented_response

  sing:
    default: not_implemented_response

  play_game:
    default: not_implemented_response

  count:
    default: not_implemented_response

  measure:
    default: not_implemented_response

