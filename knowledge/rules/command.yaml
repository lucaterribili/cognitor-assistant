# Command rules - Intent per comandi e azioni

rules:
  restaurant_booking:
    default: restaurant_booking_response

  order_food:
    default: order_food_response

  taxi_ride:
    default: taxi_ride_response

  book_flight:
    slots:
      LOCATION:
        required: true
        type: string
        entity: LOCATION
      DEPARTURE:
        required: true
        type: string
        entity: DEPARTURE
    wait:
      LOCATION: book_flight_ask_destination_response
      DEPARTURE: book_flight_ask_departure_response
    default: __book_flight
    fallback: book_flight_unsupported_response

  choose_flight_destination:
    default: choose_flight_destination_standalone_response

  choose_flight_departure:
    default: choose_flight_departure_standalone_response

  book_hotel:
    default: book_hotel_response

  generic_booking:
    wait: generic_booking_ask_type
    default: generic_booking_response
    slots:
      tipo_prenotazione:
        required: true
    cases:
      ristorante:
        restaurant_booking_response
      hotel:
        book_hotel_response
      volo:
        book_flight_response
      taxi:
        taxi_ride_response

  read_news:
    default: read_news_response

  schedule_meeting:
    default: schedule_meeting_response

  send_email:
    default: send_email_response

