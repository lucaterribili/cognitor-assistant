  # ========================================
  # Risposte per conversation stories TED
  # ========================================

  help_options_response:
    - "Certo! Posso aiutarti con ricerca informazioni, prenotazioni, meteo, calcoli, traduzioni e molto altro. Cosa ti interessa?"
    - "Ecco cosa so fare: cercare notizie, prenotare ristoranti/hotel/voli/taxi, darti il meteo, tradurre testi, rispondere a domande di cultura generale. Di cosa hai bisogno?"

  detailed_help_response:
    - "Posso aiutarti con: 1️⃣ Ricerche web e definizioni 2️⃣ Prenotazioni (ristoranti, hotel, voli, taxi) 3️⃣ Meteo e informazioni turistiche 4️⃣ Traduzioni e calcoli 5️⃣ Notizie e cultura generale. Cosa vuoi fare?"
    - "Nel dettaglio: per le prenotazioni dimmi cosa e dove, per le ricerche dimmi l'argomento, per il meteo la città. Posso anche aiutarti con la posta e le riunioni. Cosa preferisci?"

  follow_up_response:
    - "Certo, dimmi pure!"
    - "Procediamo! Di cosa hai bisogno ancora?"
    - "Sono qui per aiutarti. Cosa altro vuoi sapere?"

  information_response:
    - "Certo! Che informazioni cerchi? Posso aiutarti con curiosità, dati, definizioni e molto altro."
    - "Dimmi cosa vuoi sapere e cercherò le informazioni per te."

  detailed_information_response:
    - "Ecco più dettagli. Vuoi approfondire qualche aspetto in particolare?"
    - "Posso cercare ulteriori informazioni se mi dai più indicazioni su cosa ti interessa."

  confirmation_response:
    - "Perfetto, confermato! Procedo con la richiesta."
    - "Tutto confermato. Vado avanti!"
    - "Ok, confermo. Ora procedo."

