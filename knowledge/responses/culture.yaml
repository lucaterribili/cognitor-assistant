# Culture responses - Risposte su cultura, arte, storia

responses:
  ask_culture_wait_response:
    - "Su quale argomento culturale vuoi informazioni? Dimmi un personaggio, un'opera, un evento o un movimento artistico."
    - "Cosa vuoi sapere? Parlami di arte, storia, letteratura, musica, filosofia o mitologia."
    - "Dimmi l'argomento di cui vuoi parlare e cercherò informazioni per te."

  ask_culture_response:
    - "Ecco quello che ho trovato su questo argomento."
    - "Ho cercato e trovato informazioni rilevanti per te."
    - "Queste sono le informazioni più importanti su questo tema."
    - "Ti riassumo quello che ho trovato sulla tua richiesta culturale."

  ask_definition_wait_response:
    - "Di quale termine o concetto vuoi la definizione?"
    - "Dimmi cosa vuoi che ti spieghi e cerco la definizione."
    - "Su quale parola o concetto vuoi informazioni?"

  ask_person_date_wait_response:
    - "Di chi vuoi sapere la data di nascita o di morte?"
    - "Dimmi il nome della persona e ti dico quando è nata o morta."
    - "Su quale personaggio vuoi informazioni riguardo a nascita o morte?"
