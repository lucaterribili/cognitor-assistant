responses:
  crisis_support_response:
    - >-
      Mi dispiace che tu ti senta così, e quello che hai scritto mi
      preoccupa. Non sono la persona giusta per aiutarti con questo, ma per
      favore parlane con qualcuno: se sei in pericolo immediato chiama il
      112, oppure contatta un servizio di ascolto come Telefono Amico Italia
      (02 2327 2327, attivo tutti i giorni). Non sei solo/a: c'è chi può
      aiutarti davvero.
