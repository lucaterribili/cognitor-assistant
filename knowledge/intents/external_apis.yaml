    - dimmi i valori nutrizionali della [pasta](DISH)
    - quante proteine ha il [pollo](DISH)
    - quanti carboidrati ci sono nel [riso](DISH)
    - quante calorie ha una [banana](DISH)
    - dimmi le calorie della [pizza margherita](DISH)
    - quanti grassi ha il [parmigiano](DISH)
    - valori nutrizionali del [tonno in scatola](DISH)
    - quante calorie ha lo [yogurt greco](DISH)
    - quanto zucchero c'è nella [coca cola](DISH)
    - dimmi le proteine del [salmone](DISH)
    - quante calorie ha il [pane bianco](DISH)
    - informazioni nutrizionali sui [corn flakes](DISH)
    - quanto sale c'è nelle [patatine fritte](DISH)
    - dimmi i valori nutrizionali del [prosciutto crudo](DISH)
    - quante calorie ha una [mela](DISH)
    - quanti carboidrati ha il [pane integrale](DISH)
    - dammi le informazioni nutrizionali della [nutella](DISH)
    - quante calorie ci sono in un [hamburger](DISH)
    - valori nutrizionali dei [biscotti](DISH)
    - quante calorie ha il [gelato al cioccolato](DISH)
