nlu:
  intents:
  - intent: ask_causes
    examples:
    - Perché succede?
    - Quali sono le cause?
    - Da cosa dipende?
    - perché ci sono liste d'attesa lunghe per le visite
    - da cosa derivano i conflitti di versione delle dipendenze
    - da cosa può dipendere questo problema
    - quali sono le cause più frequenti di questo errore
    - per quale motivo si è verificata questa anomalia
    - cosa può aver provocato il blocco della pratica
    - da quali fattori è causato il ritardo
    - perché la richiesta viene respinta dal sistema
    - qual è l'origine di questo malfunzionamento
    - cosa determina lo scarto della domanda
    - per quali ragioni può verificarsi un rifiuto
    - da cosa nasce questa discrepanza nei dati
    - quali sono i motivi principali del disservizio
    - cosa causa l'interruzione della procedura
