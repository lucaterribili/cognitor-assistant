nlu:
  intents:
  - intent: ask_tax_collection
    examples:
    - Ho ricevuto una cartella esattoriale, cosa devo fare?
    - Posso rateizzare il debito con l'Agenzia delle Entrate-Riscossione?
    - Come funziona la rottamazione delle cartelle?
    - come si ottiene il certificato di carichi pendenti fiscali
    - come funziona lo stralcio o il discarico automatico delle cartelle
    - come faccio a controllare se ho debiti o carichi pendenti a ruolo
    - come funziona la sospensione legale della riscossione
    - quali sono le condizioni per aderire alla definizione agevolata
    - cosa succede dopo la notifica di un atto della riscossione
    - come posso estinguere un debito iscritto a ruolo senza sanzioni
    - in quante rate mensili si può dilazionare un debito esattoriale
    - dove scarico l'estratto di ruolo con la situazione debitoria
    - come verifico se una cartella rientra nello stralcio o condono
    - quando interviene la prescrizione dei crediti in riscossione
    - come si paga una rata scaduta del piano di dilazione
    - cosa fare se ricevo un sollecito per una somma già pagata
    - quali tutele ha il contribuente durante la procedura di riscossione
  - intent: ask_document_tax_collection
    examples:
    - ho ricevuto un [avviso bonario](DOCUMENT) dopo il controllo automatizzato, come lo pago
    - posso rateizzare un [avviso bonario](DOCUMENT) dell'[Agenzia delle Entrate](ORGANIZATION)
    - come presento la domanda di sospensione legale se la [cartella esattoriale](DOCUMENT) è già stata pagata o è prescritta
    - dopo quanti anni cade in prescrizione una [cartella esattoriale](DOCUMENT)
    - dove scarico i moduli di pagamento [Rav](DOCUMENT) o [PagoPA](PAYMENT_METHOD) delle rate della rottamazione
    - cosa succede se non pago entro sessanta giorni dalla notifica della [cartella esattoriale](DOCUMENT)
    - qual è la differenza tra [avviso di addebito](DOCUMENT) INPS e [cartella esattoriale](DOCUMENT)
    - posso compensare una [cartella esattoriale](DOCUMENT) scaduta con i crediti fiscali
    - cosa fare se ricevo un'[intimazione di pagamento](DOCUMENT) entro cinque giorni
    - posso pagare una [cartella esattoriale](DOCUMENT) parzialmente
    - come funziona la riscossione per la [partita IVA](DOCUMENT)
    - cosa prevede la procedura esattoriale relativa alla [carta d'identità elettronica](DOCUMENT)
    - come gestisco un debito a ruolo legato alla [Certificazione Unica](DOCUMENT)
    - quali opzioni di regolarizzazione o saldo ci sono per il [contratto di locazione](DOCUMENT)
    - posso sospendere o rateizzare la riscossione per la [fattura elettronica](DOCUMENT)
    - come verifico i carichi pendenti relativi al [referto](DOCUMENT)
    - come funziona la riscossione per l'[avviso bonario](DOCUMENT)
  - intent: ask_procedure_tax_collection
    examples:
    - come chiedo la [rateizzazione](PROCEDURE) di una [cartella esattoriale](DOCUMENT) online
    - fino a quale importo la [rateizzazione](PROCEDURE) delle cartelle viene concessa automaticamente
    - quante rate posso saltare prima di decadere dalla [rateizzazione](PROCEDURE)
    - come funziona la [rottamazione quater](PROCEDURE) e la definizione agevolata dei debiti
    - cosa sono i cinque giorni di tolleranza per pagare la rata della [rottamazione quater](PROCEDURE)
    - cosa faccio se ricevo un preavviso di [fermo amministrativo](PROCEDURE) sull'auto
    - come si cancella o sospende un [fermo amministrativo](PROCEDURE) pagando la prima rata
    - come funziona il [ravvedimento operoso](PROCEDURE) per regolarizzare un tributo non versato prima della cartella
    - posso chiedere una nuova [rateizzazione](PROCEDURE) se sono decaduto da un piano precedente
    - a chi mi rivolgo per bloccare una cartella pazza in [autotutela](PROCEDURE)
    - come funziona la riscossione per la [denuncia di smarrimento](PROCEDURE)
    - cosa prevede la procedura esattoriale relativa all'[apertura della partita IVA](PROCEDURE)
    - come gestisco un debito a ruolo legato alla [rottamazione delle cartelle](PROCEDURE)
    - quali opzioni di regolarizzazione o saldo ci sono per la [registrazione del contratto di locazione](PROCEDURE)
    - posso sospendere o rateizzare la riscossione per il [concordato preventivo biennale](PROCEDURE)
    - come verifico i carichi pendenti relativi all'[accertamento con adesione](PROCEDURE)
