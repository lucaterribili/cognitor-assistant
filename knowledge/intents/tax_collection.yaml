    - come chiedo l'estratto di ruolo all'[Agenzia delle Entrate-Riscossione](ORGANIZATION)
    - come attivo la domiciliazione bancaria delle rate con [Agenzia delle Entrate-Riscossione](ORGANIZATION)
    - come funziona la riscossione per la [Regione](ORGANIZATION)
    - cosa prevede la procedura esattoriale relativa all'[INPS](ORGANIZATION)
    - come gestisco un debito a ruolo legato al [Ministero della Salute](ORGANIZATION)
    - quali opzioni di regolarizzazione o saldo ci sono per l'[Ordine dei Medici](ORGANIZATION)
    - posso sospendere o rateizzare la riscossione per la [Camera di Commercio](ORGANIZATION)
    - come verifico i carichi pendenti relativi alla [Croce Rossa](ORGANIZATION)
    - come funziona la riscossione per la [Protezione Civile](ORGANIZATION)
    - cosa prevede la procedura esattoriale relativa all'[Agenzia delle Entrate](ORGANIZATION)
    - come gestisco un debito a ruolo legato all'[ASL Roma 3](ORGANIZATION)
    - quali opzioni di regolarizzazione o saldo ci sono per l'[Agenzia delle Entrate-Riscossione](ORGANIZATION)
    - posso sospendere o rateizzare la riscossione per [programmato](ORGANIZATION)
    - come verifico i carichi pendenti relativi ai [Musei Civici](ORGANIZATION)
