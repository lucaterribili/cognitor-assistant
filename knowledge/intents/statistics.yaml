  - intent: ask_statistics
    examples:
    - Ci sono dati statistici?
    - Quali sono i numeri relativi al servizio?
    - Puoi mostrarmi le statistiche?
    - ci sono dati sui tempi delle liste di attesa
    - dove trovo i dati sui premi al personale
    - quanti dirigenti ci sono
    - dove posso consultare i dati statistici e i report annuali
    - quanti utenti usufruiscono del servizio ogni anno
    - avete statistiche aggiornate sui volumi di attività
    - qual è la percentuale di pratiche concluse con successo
    - dove vengono pubblicati i bilanci e gli indicatori statistici
    - ci sono grafici o tabelle con i dati dell'ultimo anno
    - quali sono i numeri principali registrati nel territorio
    - ogni quanto vengono aggiornate le statistiche ufficiali
    - esiste un osservatorio con i dati statistici pubblici
    - qual è il trend numerico degli ultimi anni
    - dove trovo le statistiche sulle prestazioni erogate
