    examples:
    - Qual è la scadenza?
    - Entro quando devo presentare la domanda?
    - Quanto tempo ho a disposizione?
    - fino a quando posso scegliere il medico online
    - fino a che giorno è visitabile la mostra temporanea al museo
    - qual è la data di scadenza da rispettare
    - entro quando bisogna inviare tutta la pratica
    - fino a che giorno è possibile presentare la domanda
    - quando scadono i termini ufficiali
    - c'è una data limite tassativa da non superare
    - sono previste proroghe rispetto alla scadenza ordinaria
    - qual è l'ultimo giorno utile per procedere
    - a che ora del giorno di scadenza chiude l'invio
    - cosa succede se il giorno di scadenza cade di festivo
    - dove verifico tutte le prossime scadenze in calendario
    - quanto tempo mi resta prima della scadenza
