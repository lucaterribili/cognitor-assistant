    examples:
    - Sono disponibili corsi di formazione?
    - Come posso iscrivermi a un corso?
    - Quali percorsi formativi offrite?
    - ci sono corsi di formazione per il personale sanitario
    - ci sono corsi sulla sicurezza sul lavoro
    - quali corsi di formazione e aggiornamento organizzate
    - i corsi di formazione rilasciano crediti ECM o attestati riconosciuti
    - come ci si iscrive ai percorsi di formazione professionale
