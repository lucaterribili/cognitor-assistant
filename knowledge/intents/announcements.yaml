  - intent: ask_announcements
    examples:
    - Ci sono nuovi avvisi?
    - Quali comunicazioni sono state pubblicate?
    - Dove trovo gli annunci?
    - ci sono avvisi per l'utenza
    - dove trovo l'avviso per la copertura di un turno di medicina specialistica
    - ci sono nuovi bandi di gara
    - dove trovo gli esiti delle gare
    - dove trovo gli avvisi pubblici dell'azienda
    - dove trovo gli avvisi di gara e i bandi di affidamento del Comune
    - ci sono circolari o avvisi urgenti della presidenza scolastica
