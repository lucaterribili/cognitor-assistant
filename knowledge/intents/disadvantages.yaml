nlu:
  intents:
  - intent: ask_disadvantages
    examples:
    - Quali sono gli svantaggi?
    - Ci sono aspetti negativi?
    - Quali sono i limiti?
    - quali sono gli svantaggi di questa opzione
    - ci sono aspetti negativi o limiti da conoscere
    - quali sono i principali punti deboli
    - che controindicazioni possono esserci
    - quali criticità presenta rispetto ad altre scelte
    - ci sono vincoli o penalizzazioni se scelgo questa soluzione
    - quali sono i contro da valutare prima di decidere
    - in quali casi questa scelta risulta svantaggiosa
    - che inconvenienti può comportare nel tempo
    - quali limitazioni pratiche ha questo sistema
    - c'è qualche lato negativo che dovrei considerare
    - quali sono i difetti più comuni riscontrati
    - perché qualcuno potrebbe sconsigliarlo
    - quali ostacoli o svantaggi comporta
    - vorrei sapere quali sono gli svantaggi di questa opzione
