nlu:
  intents:
  - intent: ask_changes
    examples:
    - Ci sono state modifiche?
    - Cosa è cambiato?
    - Sono cambiati gli orari?
    - cosa è cambiato rispetto alla versione precedente
    - ci sono state variazioni negli ultimi mesi
    - come posso modificare i dati che ho già inviato
    - sono previste modifiche alle condizioni attuali
    - è possibile fare una variazione dopo l'invio
    - quali cambiamenti sono stati introdotti di recente
    - come comunico una variazione dei miei recapiti
    - le modalità sono cambiate quest'anno
    - c'è stata qualche modifica al regolamento
    - posso rettificare o cambiare una scelta già fatta
    - dove trovo il riepilogo delle modifiche apportate
    - ci sono novità o cambiamenti di cui tener conto
    - fino a quando posso apportare modifiche alla domanda
    - sono cambiati i riferimenti rispetto all'anno scorso
    - vorrei sapere cosa è cambiato rispetto alla versione precedente
