    examples:
    - Come posso presentare un reclamo?
    - Dove posso segnalare un problema?
    - A chi posso rivolgermi per una contestazione?
    - voglio segnalare un comportamento scorretto del personale
    - come segnalo un abuso in struttura
    - ho avuto un problema con il ricovero
    - voglio contestare l'esclusione dalla graduatoria
