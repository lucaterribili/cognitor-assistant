    examples:
    - Qual è lo stato della pratica?
    - La richiesta è stata elaborata?
    - il mio reclamo è stato preso in carico
    - Qual è lo stato di avanzamento della pratica?
    - a che punto è la lavorazione della mia pratica
    - la mia domanda è stata accettata o è ancora in attesa
    - lo stato della mia prenotazione risulta confermato
    - la pratica di rinnovo è stata completata
    - la mia richiesta di rimborso è in lavorazione
    - come posso verificare lo stato della mia richiesta
    - la mia domanda risulta approvata o ancora in istruttoria
    - dove controllo se l'esito della pratica è già disponibile
    - cosa significa lo stato in lavorazione sul portale
    - come faccio a sapere se la pratica è stata sbloccata
    - lo stato della richiesta viene aggiornato automaticamente
    - posso ricevere una notifica quando cambia lo stato della domanda
    - vorrei sapere a che punto è la lavorazione della mia pratica
    - vorrei sapere come posso verificare lo stato della mia richiesta
