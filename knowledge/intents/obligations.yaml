nlu:
  intents:
  - intent: ask_obligations
    examples:
    - Quali obblighi devo rispettare?
    - Cosa sono tenuto a fare?
    - Quali responsabilità ho?
    - sono obbligato a vaccinare i miei figli
    - sono tenuto a disdire la visita se non posso venire
    - quali obblighi di pubblicità hanno i bandi di gara
    - devo comunicare la scadenza del documento
    - quali doveri ho come paziente ricoverato
    - devo dichiarare nel quadro RW i conti correnti detenuti all'estero
    - sono obbligato a comunicare la variazione del domicilio fiscale
    - quali sono i miei obblighi come cittadino o utente
    - ci sono adempimenti obbligatori da rispettare
    - cosa sono obbligato a dichiarare o comunicare
    - è un adempimento facoltativo o obbligatorio per legge
    - quali doveri ha chi sottoscrive la richiesta
    - ci sono obblighi di comunicazione periodica
