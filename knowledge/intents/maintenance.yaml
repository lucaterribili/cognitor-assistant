  - intent: ask_maintenance
    examples:
    - Quando viene effettuata la manutenzione?
    - Come si richiede un intervento?
    - Quali operazioni di manutenzione sono previste?
    - come richiedo la manutenzione di un ausilio
    - come richiedo un intervento sul presidio protesico
    - chi fa la manutenzione dei dispositivi medici
    - come segnalo un malfunzionamento dell'ausilio
    - come si gestisce la manutenzione evolutiva del codice
    - ogni quanto tempo viene effettuata la manutenzione
    - a chi devo chiedere per la manutenzione ordinaria
    - sono previste finestre di manutenzione programmata del portale
    - come funziona l'assistenza per la manutenzione delle apparecchiature
    - chi sostiene i costi della manutenzione periodica
    - cosa fare se serve una manutenzione straordinaria urgente
    - come aggiorno e mantengo attivi i miei dati
    - c'è un servizio di revisione e controllo periodico
    - quanto dura il fermo tecnico durante la manutenzione
