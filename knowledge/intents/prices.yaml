nlu:
  intents:
  - intent: ask_prices
    examples:
    - Qual è il prezzo?
    - Quanto devo pagare?
    - Dove trovo il listino prezzi?
    - dove trovo il listino delle prestazioni
    - dove trovo il tariffario delle prestazioni specialistiche
    - quanto si paga per la copia conforme di un atto registrato
    - dove posso consultare il listino prezzi aggiornato
    - quali sono le tariffe applicate quest'anno
    - i prezzi indicati nel tariffario sono comprensivi di imposte
    - qual è la tariffa base prevista dal listino
    - ci sono variazioni di prezzo in base alla fascia oraria o al reddito
    - mi dici i prezzi delle singole voci del tariffario
    - qual è l'importo esatto della tariffa ordinaria
    - dove trovo la tabella con tutte le tariffe ufficiali
    - i prezzi sono fissi o variano in base al caso
    - c'è un tariffario pubblico consultabile online
