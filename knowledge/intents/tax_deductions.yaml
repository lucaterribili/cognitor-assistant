nlu:
  intents:
  - intent: ask_tax_deductions
    examples:
    - Quali spese posso scaricare dalle tasse?
    - Quali detrazioni e deduzioni mi spettano?
    - Posso portare in detrazione questa spesa?
    - qual è la franchigia di centoventinove euro per le spese sanitarie
    - quali spese scolastiche e universitarie sono detraibili
    - posso detrarre l'abbonamento ai mezzi di trasporto pubblico
    - si possono scaricare le spese per lo sport dei figli minorenni
    - posso dedurre i contributi previdenziali versati per colf e badanti
    - i versamenti al fondo di previdenza complementare sono deducibili
    - sono detraibili le polizze assicurative sulla vita e contro gli infortuni
    - posso scaricare le erogazioni liberali alle ONLUS e al terzo settore
    - come funzionano le detrazioni per figli e coniuge a carico
    - quali spese per persone con disabilità sono detraibili o deducibili
    - qual è la differenza tra spesa detraibile e spesa deducibile
    - fino a quale tetto massimo posso detrarre le spese sostenute
    - per avere diritto alla detrazione serve sempre il pagamento tracciabile
