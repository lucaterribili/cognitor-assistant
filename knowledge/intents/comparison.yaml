nlu:
  intents:
  - intent: ask_comparison
    examples:
    - Qual è la differenza tra questi servizi?
    - Quale delle due soluzioni è migliore?
    - Puoi confrontare queste alternative?
    - qual è la differenza principale tra le due opzioni
    - puoi farmi un confronto tra le soluzioni disponibili
    - cosa cambia in concreto tra la prima e la seconda scelta
    - quale delle due alternative conviene di più a confronto
    - in che cosa si differenziano esattamente
    - mi metti a confronto i pro e i contro delle due modalità
    - che differenza c'è tra il percorso ordinario e quello semplificato
    - come faccio a confrontare le diverse offerte
    - quali sono le differenze sostanziali tra i due profili
    - c'è una tabella comparativa per vedere le differenze
    - rispetto alla soluzione standard cosa cambia
    - in quali casi è preferibile l'uno rispetto all'altro
    - che divario c'è tra le due possibilità
