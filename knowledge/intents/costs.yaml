nlu:
  intents:
  - intent: ask_costs
    examples:
    - Quanto costa?
    - Quali sono i costi del servizio?
    - È gratuito?
    - quanto costa il ricovero
    - quanto costa comprare una casa
    - quanto costa il riscaldamento in un appartamento
    - costo dell'assicurazione scolastica obbligatoria per gli alunni
    - ci sono costi di attivazione o di gestione
    - il servizio è completamente gratuito o a pagamento
    - a quanto ammonta la spesa complessiva
    - sono previsti oneri o diritti di segreteria
    - quanto si spende in tutto per completare l'operazione
    - ci sono costi aggiuntivi nascosti da considerare
    - qual è l'importo totale da sostenere
    - è prevista una quota fissa di partecipazione
    - quanto viene a costare per i residenti
    - ci sono spese di istruttoria da versare
