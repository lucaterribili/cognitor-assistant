nlu:
  intents:
  - intent: ask_accessibility
    examples:
    - La struttura è accessibile ai disabili?
    - Ci sono ascensori?
    - Sono presenti servizi per persone con mobilità ridotta?
    - come funziona l'assistenza per le persone non udenti in ospedale
    - esiste un servizio di assistenza fiscale a domicilio per contribuenti con disabilità
    - c'è una corsia prioritaria allo sportello delle Entrate per persone con mobilità ridotta
    - le sedi comunali e l'ufficio anagrafe sono accessibili alle persone in sedia a rotelle
    - come posso richiedere il contrassegno di parcheggio per disabili
    - la struttura è accessibile alle persone in carrozzina
    - ci sono percorsi dedicati per chi ha disabilità motoria
    - sono presenti rampe e ascensori per i disabili
    - avete servizi di accessibilità per non vedenti e ipovedenti
    - è previsto un accesso prioritario per le persone fragili
    - come garantite l'accessibilità degli spazi al pubblico
    - ci sono parcheggi riservati ai disabili vicino all'ingresso
    - il sito web rispetta i criteri di accessibilità digitale
    - sono disponibili postazioni accessibili agli sportelli
