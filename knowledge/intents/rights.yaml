nlu:
  intents:
  - intent: ask_rights
    examples:
    - Quali sono i miei diritti?
    - Quali tutele sono previste?
    - quali sono i miei diritti di paziente
    - ho diritto a scegliere il medico
    - ho diritto a un interprete in ospedale
    - quali tutele ho se aspetto troppo per una visita
    - posso rifiutare un ricovero
    - posso chiedere un secondo parere medico
    - ho diritto alla riservatezza dei miei dati sanitari
    - ho diritto a ricevere assistenza a domicilio
    - quali sono i diritti di un lavoratore in malattia
    - Quali diritti posso far valere?
    - quali diritti ha il cittadino disoccupato per le cure sanitarie
    - quali sono i diritti del contribuente durante una verifica fiscale
    - quali sono i diritti garantiti all'utente
    - dove posso consultare la carta dei diritti del cittadino
    - ho diritto a ricevere una risposta scritta motivata
    - vorrei sapere quali sono i diritti garantiti all'utente
