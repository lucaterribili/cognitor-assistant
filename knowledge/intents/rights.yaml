    - cosa prevede la tutela dei diritti dell'utente per lo [SPID](DOCUMENT)
    - ho diritto di accesso o di replica in merito al [concorso pubblico](DOCUMENT)
    - quali garanzie e diritti mi spettano sulla [visura catastale](DOCUMENT)
    - come faccio valere i miei diritti relativi alla [tessera sanitaria](DOCUMENT)
    - quali diritti riconosce la legge per la [cartella clinica](DOCUMENT)
    - quali diritti ho riguardo al [codice fiscale](DOCUMENT)
