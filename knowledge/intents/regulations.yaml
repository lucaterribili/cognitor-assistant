nlu:
  intents:
  - intent: ask_regulations
    examples:
    - Quali normative regolano il servizio?
    - Dove trovo il regolamento?
    - Quali sono le disposizioni applicabili?
    - quale normativa si applica ai bandi di gara
    - quali regole valgono per le liste di attesa
    - cosa prevede la legge sull'accesso alle cure
    - quali sono le norme sulla residenza
    - qual è la normativa per sposare una donna russa in [Italia](COUNTRY)
    - è consentito scattare fotografie con flash all'interno delle sale del museo
    - si può entrare con cani nei musei o nei giardini storici
    - qual è la normativa vigente in materia
    - dove posso consultare il regolamento ufficiale completo
    - quali leggi o decreti disciplinano questo ambito
    - ci sono state modifiche normative recenti da conoscere
    - cosa dice il regolamento interno a questo proposito
    - quali sono i riferimenti legislativi applicabili
    - il regolamento prevede deroghe o casi particolari
