nlu:
  intents:
  - intent: ask_privacy
    examples:
    - Come vengono trattati i miei dati?
    - Quali dati personali raccogliete?
    - come vengono trattati i miei dati personali secondo il GDPR
    - dove posso leggere l'informativa completa sulla privacy
    - a chi mi rivolgo per esercitare il diritto alla cancellazione dei dati
    - per quanto tempo conservate i dati personali degli utenti
    - posso revocare o modificare i consensi privacy che ho prestato
    - i miei dati vengono condivisi con soggetti terzi
    - chi è il responsabile della protezione dei dati personali
    - come garantite la riservatezza delle informazioni sensibili
    - come posso scaricare o rettificare i miei dati personali registrati
    - il trattamento dei dati rispetta la normativa europea sulla privacy
    - dove firmo il consenso al trattamento dei dati personali
    - quali misure adottate per proteggere la privacy degli utenti
    - posso oppormi al trattamento dei miei dati per comunicazioni
    - come viene tutelato il segreto professionale e la riservatezza
    - qual è la politica di gestione dei cookie e della privacy sul portale
