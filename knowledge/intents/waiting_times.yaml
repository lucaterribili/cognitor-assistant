  - intent: ask_waiting_times
    examples:
    - Quanto devo aspettare?
    - Quali sono i tempi di attesa?
    - Quanto tempo serve per ottenere una risposta?
    - quanto ci vuole per ottenere il certificato di idoneità
    - quanto devo aspettare per il rimborso in busta paga o sulla pensione
    - quali sono i tempi medi di attesa in questo periodo
    - quanto tempo bisogna aspettare prima di ricevere risposta
    - dopo quanti giorni lavorativi viene conclusa la pratica
    - c'è una lista d'attesa lunga o i tempi sono rapidi
    - esiste una corsia prioritaria per ridurre i tempi di attesa
    - dove posso consultare il monitoraggio dei tempi di attesa
    - quanto si aspetta mediamente allo sportello prima del proprio turno
    - in quanti giorni viene emesso l'esito finale
    - i tempi di attesa variano in base alla priorità indicata
    - qual è il tempo massimo previsto per la conclusione dell'iter
    - quanto devo attendere dalla presentazione della domanda
    - come mai i tempi di attesa sono così lunghi
    - vorrei sapere quali sono i tempi medi di attesa in questo periodo
