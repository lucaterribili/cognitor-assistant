nlu:
  intents:
  - intent: ask_directions
    examples:
    - Come posso arrivarci?
    - Qual è il percorso migliore?
    - Come raggiungo la struttura?
    - come faccio a raggiungermi con i mezzi pubblici
    - quali sono le indicazioni stradali per arrivare da voi
    - qual è la fermata dell'autobus o del treno più vicina
    - c'è un parcheggio comodo se vengo in auto
    - qual è l'uscita consigliata per arrivare alla sede
    - come si arriva a piedi dalla stazione più vicina
    - mi spieghi il percorso migliore per raggiungere lo sportello
    - quale linea di trasporto pubblico passa davanti alla struttura
    - ci sono indicazioni chiare lungo la strada per trovarvi
    - qual è la strada più veloce per arrivare in sede
    - è facile arrivare con i mezzi o conviene l'auto
    - da quale ingresso conviene entrare arrivando dal centro
    - mi dai le coordinate o il percorso per raggiungervi
    - qual è l'itinerario consigliato nel traffico
