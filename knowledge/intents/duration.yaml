  - intent: ask_duration
    examples:
    - Quanto dura?
    - Quanto tempo richiede la procedura?
    - Qual è la durata del servizio?
    - quanto dura il percorso di riabilitazione
    - quanto dura una seduta di riabilitazione
    - qual è la durata complessiva prevista
    - quanto tempo dura dall'inizio alla fine
    - per quanti mesi o anni resta in vigore
    - quanto dura mediamente l'appuntamento
    - qual è il periodo di validità prima che scada
    - quante ore o giorni dura l'attività
    - la durata è fissa o può variare
    - quanto tempo devo mettere in conto
    - ha una durata temporanea o permanente
    - qual è la durata massima consentita
    - per quanto tempo rimane attivo
    - quanto dura la sessione
    - vorrei sapere qual è la durata complessiva prevista
